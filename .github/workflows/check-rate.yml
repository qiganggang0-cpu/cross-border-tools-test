name: check-exchange-rate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run script
        run: python scripts/check_rate.py
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}  
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exchange_rate.csv
          if git diff --cached --quiet; then
            echo "没有新变化，跳过提交"
          else
            git commit -m "更新汇率记录 $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
