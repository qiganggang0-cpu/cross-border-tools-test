<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跨境电商数据看板</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 24px; background: #f5f5f5; color: #222; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; margin-top: 32px; border-left: 4px solid #2c7; padding-left: 8px; }
    table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    th, td { border-bottom: 1px solid #eee; padding: 8px 10px; text-align: left; font-size: 13px; }
    th { background: #fafafa; position: sticky; top: 0; }
    .updated { color: #888; font-size: 12px; margin-bottom: 16px; }
    .wrap { max-width: 960px; margin: 0 auto; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>跨境电商数据看板</h1>
  <div class="updated" id="updated">加载中...</div>

  <h2>汇率记录</h2>
  <table id="rate-table"><thead><tr><th>时间 (UTC)</th><th>基准</th><th>目标</th><th>汇率</th></tr></thead><tbody></tbody></table>

  <h2>商品价格记录</h2>
  <table id="product-table">
    <thead><tr><th>时间 (UTC)</th><th>ID</th><th>标题</th><th>价格</th><th>类目</th><th>评分</th><th>库存</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
async function loadCsv(path) {
  const res = await fetch(path + "?t=" + Date.now());
  if (!res.ok) return [];
  const text = await res.text();
  const lines = text.trim().split("\n");
  if (lines.length < 2) return [];
  const headers = lines[0].split(",");
  return lines.slice(1).map(line => {
    const cells = line.split(",");
    const row = {};
    headers.forEach((h, i) => row[h.trim()] = (cells[i] || "").trim());
    return row;
  });
}

function fillTable(tableId, rows, cols) {
  const tbody = document.querySelector("#" + tableId + " tbody");
  tbody.innerHTML = "";
  rows.slice(-50).reverse().forEach(r => {
    const tr = document.createElement("tr");
    cols.forEach(c => {
      const td = document.createElement("td");
      td.textContent = r[c] || "";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

(async () => {
  const rates = await loadCsv("data/exchange_rate.csv");
  fillTable("rate-table", rates, ["time_utc", "base", "quote", "rate"]);

  const products = await loadCsv("data/product_prices.csv");
  fillTable("product-table", products, ["time_utc", "product_id", "title", "price", "category", "rating_rate", "stock"]);

  document.getElementById("updated").textContent = "最后刷新：" + new Date().toLocaleString();
})();
</script>
</body>
</html>
